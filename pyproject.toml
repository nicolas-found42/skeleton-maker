[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-maker"
version = "0.1.0"
description = "Draw 3D body-pose skeletons on any video using the NVIDIA 3D Body Pose NIM."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nicolas" }]
keywords = ["body-pose", "pose-estimation", "skeleton", "nvidia", "nim", "yolo", "video"]

dependencies = [
    "grpcio==1.67.1",
    "grpcio-tools==1.67.1",
    "protobuf>=5.27,<6",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.9,<5",
    "tqdm>=4.66",
    "ultralytics>=8.3",
    "lap>=0.5.12",
]

[project.optional-dependencies]
download = ["yt-dlp>=2024.1.1"]

# Dev tools (PEP 735). `uv sync` installs this group by default.
# ruff and ty are pinned exactly: ty is beta and 0.0.x releases can add new errors,
# so bump either deliberately, in its own PR. Keep ruff in step with
# .pre-commit-config.yaml (the ruff-pre-commit rev).
[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff==0.16.10",
    "tomli>=2.4.1",
    "ty==0.0.84",
]

[project.scripts]
skeleton-maker = "skeleton_maker.cli:main"

# _gen is populated from proto/ at first use, so it is not a declared package.
[tool.setuptools]
packages = ["skeleton_maker"]

[tool.setuptools.package-data]
skeleton_maker = ["proto/**/*.proto", "characters/*.json", "web/*.html", "web/*.js", "workers/*.py", "workers/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# Check against the oldest supported Python, so 3.10-incompatible code is caught.
python-version = "3.10"

[tool.ty.src]
include = ["skeleton_maker", "tests", "scripts", "experiments"]
# Generated gRPC stubs are rebuilt from proto/ on demand and gitignored.
# Worker modules are shipped and imported by offline tests; their model dependencies stay lazy.
exclude = ["skeleton_maker/_gen"]

[tool.coverage.run]
source = ["skeleton_maker"]
# Keep the data file inside the already-ignored .pytest_cache.
data_file = ".pytest_cache/.coverage"
# Generated gRPC stubs are rebuilt from proto/ on demand and gitignored.
omit = ["skeleton_maker/_gen/*"]

[tool.coverage.report]
# Ratchet: this floor may only ever go up. Raise it when a PR adds tests; never lower it.
fail_under = 82
show_missing = true

[tool.typos.files]
# Vendored, minified third-party code (three.js): not ours to spell-check.
extend-exclude = ["skeleton_maker/web/three.module.min.js"]

[tool.typos.default.extend-words]
# A real three.js material property (MeshStandardMaterial.metalness), used in the character specs.
metalness = "metalness"

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated gRPC stubs are rebuilt from proto/ on demand and gitignored.
extend-exclude = ["skeleton_maker/_gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skeleton_maker"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written.
"tests/**" = ["S101"]
