name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: [needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: What is wrong
      description: One independently fixable problem, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact command and inputs, in order, from a stated starting state. Link or describe a minimal video if one is needed.
      placeholder: |
        1. `skeleton-maker ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What you observed, with the smallest useful log excerpt. Remove any API keys.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, `skeleton-maker --version` or commit, ffmpeg version.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell the fix is complete, checkable by running a command.
      placeholder: "- [ ] ..."
    validations:
      required: true
