version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, to let supply-chain
    # compromises surface first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: []

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
        # ty (beta, 0.0.x) and ruff are bumped deliberately, each in its own PR.
        exclude-patterns: ["ty", "ruff"]
    commit-message:
      prefix: "chore"
    labels: []
